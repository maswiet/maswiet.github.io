<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Peta fase tidur yang membedakan NREM dengan tiga tahap N1 N2 N3, serta REM sebagai fase lain."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect x="80" y="245" width="300" height="110" fill="#F8F6F1" stroke="#2F5D62"/><text x="98" y="288" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="98" dy="0">Tidur</tspan></text><text x="98" y="329" fill="#5F625C" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Dua fase</tspan></text><rect x="510" y="215" width="250" height="95" fill="#F8F6F1" stroke="#2F5D62"/><text x="528" y="258" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="528" dy="0">NREM</tspan></text><rect x="900" y="215" width="300" height="95" fill="#F8F6F1" stroke="#2F5D62"/><text x="918" y="258" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="918" dy="0">REM</tspan></text><text x="918" y="299" fill="#5F625C" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="918" dy="0">Gerak mata cepat</tspan></text><line x1="380" y1="290" x2="455" y2="290" stroke="#2F5D62" stroke-width="3" /><line x1="455" y1="290" x2="455" y2="260" stroke="#2F5D62" stroke-width="3" /><line x1="455" y1="260" x2="510" y2="260" stroke="#2F5D62" stroke-width="3" marker-end="url(#a)"/><line x1="455" y1="260" x2="455" y2="185" stroke="#2F5D62" stroke-width="3" /><line x1="455" y1="185" x2="1050" y2="185" stroke="#2F5D62" stroke-width="3" /><line x1="1050" y1="185" x2="1050" y2="215" stroke="#2F5D62" stroke-width="3" marker-end="url(#a)"/><rect x="130" y="420" width="300" height="110" fill="#F8F6F1" stroke="#2F5D62"/><text x="148" y="463" fill="#2F