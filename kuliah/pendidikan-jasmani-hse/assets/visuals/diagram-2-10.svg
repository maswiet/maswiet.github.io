<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Perbandingan angka simulasi denyut sebelum aktivitas 72 dan saat aktivitas ringan 96, berselisih 24 denyut per menit."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><text x="115" y="275" fill="#2F5D62" font-family="Arial,sans-serif" font-size="30" font-weight="400"><tspan x="115" dy="0">Sebelum aktivitas</tspan></text><text x="115" y="411" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="91" font-weight="700"><tspan x="115" dy="0">72</tspan></text><text x="115" y="464" fill="#5F625C" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="115" dy="0">denyut/menit</tspan></text><line x1="520" y1="380" x2="715" y2="380" stroke="#2F5D62" stroke-width="4" marker-end="url(#a)"/><text x="770" y="275" fill="#2F5D62" font-family="Arial,sans-serif" font-size="30" font-weight="400"><tspan x="770" dy="0">Saat aktivitas ringan</tspan></text><text x="770" y="411" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="91" font-weight="700"><tspan x="770" dy="0">96</tspan></text><text x="770" y="464" fill="#5F625C" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="770" dy="0">denyut/menit</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Selisih = 24 denyut/menit. Angka simulasi ini belum menjelaskan penyebabnya.</tspan></text></svg>