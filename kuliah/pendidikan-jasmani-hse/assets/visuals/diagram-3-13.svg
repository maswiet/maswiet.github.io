<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Skema tahapan peningkatan paparan panas selama masa aklimatisasi, tanpa persentase paparan."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect x="110" y="450" width="210" height="75" fill="#DFE8E5" stroke="none"/><rect x="360" y="390" width="210" height="135" fill="#B7CDCA" stroke="none"/><rect x="610" y="325" width="210" height="200" fill="#7DA7A4" stroke="none"/><rect x="860" y="260" width="210" height="265" fill="#2F5D62" stroke="none"/><text x="115" y="560" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="115" dy="0">Awal</tspan></text><text x="370" y="560" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="370" dy="0">Bertahap</tspan></text><text x="630" y="560" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="630" dy="0">Ditinjau ulang</tspan></text><text x="870" y="560" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="870" dy="0">Sesuai kondisi</tspan></text><text x="115" y="249" fill="#2F5D62" font-family="Arial,sans-serif" font-size="34" font-weight="700"><tspan x="115" dy="0">Paparan dinaikkan bertahap selama 7–14 hari</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Tinggi batang hanya skema tahapan, bukan persentase atau jadwal baku.</tspan></text></svg>