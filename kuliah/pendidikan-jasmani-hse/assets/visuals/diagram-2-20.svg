<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Lima tingkat hierarki pengendalian dari eliminasi, substitusi, rekayasa, administratif, hingga APD."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect x="80" y="218" width="1120" height="57" fill="#2F5D62" stroke="#F8F6F1"/><text x="98" y="254" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="27" font-weight="700"><tspan x="98" dy="0">Eliminasi</tspan></text><text x="345" y="252" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="345" dy="0">Hilangkan kebutuhan memindahkan</tspan></text><rect x="80" y="286" width="1045" height="57" fill="#DCE7E4" stroke="#F8F6F1"/><text x="98" y="322" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="27" font-weight="700"><tspan x="98" dy="0">Substitusi</tspan></text><text x="345" y="320" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="345" dy="0">Ganti alat atau metode setelah menilai risiko</tspan></text><rect x="80" y="354" width="970" height="57" fill="#F1EEE7" stroke="#F8F6F1"/><text x="98" y="390" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="27" font-weight="700"><tspan x="98" dy="0">Rekayasa</tspan></text><text x="345" y="388" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="345" dy="0">Pisahkan manusia dari bahaya</tspan></text><rect x="80" y="422" width="895" height="57" fill="#F1EEE7" stroke="#F8F6F1"/><text x="98" y="458" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="27" font-weight="700"><tspan x="98" dy="0">Administratif</tspan></text><text x="345" y="456" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="345" dy="0">Atur cara, peran, dan waktu kerja</tspan></text><rect x="80" y="490" width="820" height="57" fill="#F1EEE7" stroke="#F8F6F1"/><text x="98" y="526" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="27" font-weight="700"><tspan x="98" dy="0">APD</tspan></text><text x="345" y="524" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="345" dy="0">Lindungi individu sesuai bahaya</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Utamakan perubahan pada sumber bahaya; beberapa kendali dapat digabung.</tspan></text></svg>