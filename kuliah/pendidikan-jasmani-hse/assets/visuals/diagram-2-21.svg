<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Alur tiga tahap praktik ringan: memeriksa, menyepakati metode, lalu melakukan atau mengamati."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect x="80" y="270" width="345.3333333333333" height="145" fill="#F8F6F1" stroke="#2F5D62"/><text x="98" y="313" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="98" dy="0">Periksa</tspan></text><text x="98" y="354" fill="#5F625C" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="98" dy="0">Kotak, jalur, dan tujuan</tspan></text><line x1="430.3333333333333" y1="343" x2="461.3333333333333" y2="343" stroke="#2F5D62" stroke-width="3" marker-end="url(#a)"/><rect x="467.3333333333333" y="270" width="345.3333333333333" height="145" fill="#F8F6F1" stroke="#2F5D62"/><text x="485.3333333333333" y="313" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="485.3333333333333" dy="0">Sepakati</tspan></text><text x="485.3333333333333" y="354" fill="#5F625C" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="485.3333333333333" dy="0">Metode, bantuan, dan</tspan><tspan x="485.3333333333333" dy="28.75">aba-aba</tspan></text><line x1="817.6666666666666" y1="343" x2="848.6666666666666" y2="343" stroke="#2F5D62" stroke-width="3" marker-end="url(#a)"/><rect x="854.6666666666666" y="270" width="345.3333333333333" height="145" fill="#F8F6F1" stroke="#2F5D62"/><text x="872.6666666666666" y="313" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="872.6666666666666" dy="0">Lakukan</tspan></text><text x="872.6666666666666" y="354" fill="#5F625C" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="872.6666666666666" dy="0">Gerak terkendali atau</tspan><tspan x="872.6666666666666" dy="28.75">amati</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Kotak kosong atau sangat ringan, di ruang datar; berhenti bila ada keluhan.</tspan></text></svg>