<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Dua diagram lengan momen dengan massa sama 10 kg. Jarak digandakan dari 0,20 ke 0,40 meter sehingga momennya dua kali lipat."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><text x="80" y="241" fill="#2F5D62" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="80" dy="0">Jarak 0,20 m</tspan></text><text x="700" y="241" fill="#8A2D1F" font-family="Arial,sans-serif" font-size="31" font-weight="700"><tspan x="700" dy="0">Jarak 0,40 m</tspan></text><line x1="135" y1="405" x2="510" y2="405" stroke="#1F1F1B" stroke-width="5" /><line x1="755" y1="405" x2="1130" y2="405" stroke="#1F1F1B" stroke-width="5" /><rect x="130" y="400" width="12" height="110" fill="#2F5D62" stroke="#2F5D62"/><rect x="750" y="400" width="12" height="110" fill="#2F5D62" stroke="#2F5D62"/><line x1="135" y1="310" x2="320" y2="310" stroke="#2F5D62" stroke-width="3" marker-end="url(#a)"/><line x1="755" y1="310" x2="1125" y2="310" stroke="#8A2D1F" stroke-width="3" marker-end="url(#a)"/><line x1="320" y1="350" x2="320" y2="445" stroke="#2F5D62" stroke-width="4" marker-end="url(#a)"/><line x1="1125" y1="350" x2="1125" y2="445" stroke="#8A2D1F" stroke-width="4" marker-end="url(#a)"/><text x="245" y="291" fill="#2F5D62" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="245" dy="0">d = 0,20 m</tspan></text><text x="880" y="291" fill="#8A2D1F" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="880" dy="0">d = 0,40 m</tspan></text><text x="265" y="480" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="28" font-weight="400"><tspan x="265" dy="0">10 kg</tspan></text><text x="1020" y="480" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="28" font-weight="400"><tspan x="1020" dy="0">10 kg</tspan></text><text x="95" y="554" fill="#2F5D62" font-family="Arial,sans-serif" font-size="34" font-weight="700"><tspan x="95" dy="0">M ≈ 19,6 N·m</tspan></text><text x="715" y="554" fill="#8A2D1F" font-family="Arial,sans-serif" font-size="34" font-weight="700"><tspan x="715" dy="0">M ≈ 39,2 N·m</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Model ideal M = m g d. Titik acuan tetap; bukan estimasi gaya tulang belakang.</tspan></text></svg>