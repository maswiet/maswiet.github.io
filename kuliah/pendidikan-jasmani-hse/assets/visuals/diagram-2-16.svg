<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Diagram dua pilihan tinggi permukaan kerja dengan penanda penyesuaian tinggi dan posisi, tanpa angka antropometri baku."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><text x="100" y="249" fill="#2F5D62" font-family="Arial,sans-serif" font-size="29" font-weight="700"><tspan x="100" dy="0">Rentang jangkauan pengguna</tspan></text><line x1="145" y1="355" x2="1080" y2="355" stroke="#2F5D62" stroke-width="4" /><line x1="145" y1="445" x2="1080" y2="445" stroke="#5F625C" stroke-width="3" /><line x1="290" y1="355" x2="290" y2="530" stroke="#1F1F1B" stroke-width="4" /><line x1="900" y1="355" x2="900" y2="530" stroke="#1F1F1B" stroke-width="4" /><line x1="1160" y1="355" x2="1160" y2="445" stroke="#8A2D1F" stroke-width="4" marker-end="url(#a)"/><text x="100" y="324" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="26" font-weight="400"><tspan x="100" dy="0">Permukaan kerja yang dapat diatur</tspan></text><text x="350" y="490" fill="#5F625C" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="350" dy="0">Pilihan tinggi, pegangan, dan posisi</tspan></text><text x="1000" y="500" fill="#8A2D1F" font-family="Arial,sans-serif" font-size="25" font-weight="400"><tspan x="1000" dy="0">Sesuaikan</tspan><tspan x="1000" dy="31.25">dengan tugas</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Skema desain tanpa ukuran baku; gunakan dimensi dan kebutuhan pengguna.</tspan></text></svg>