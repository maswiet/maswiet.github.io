<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 180 1280 460" role="img" aria-label="Siklus konseptual sekitar 24 jam terbagi fase terang dan gelap, tanpa menentukan waktu tidur universal."><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L7,3 L0,6" fill="none" stroke="context-stroke" stroke-width="2"/></marker></defs><rect x="105" y="285" width="540" height="150" fill="#E6EDEB" stroke="none"/><rect x="645" y="285" width="540" height="150" fill="#334D50" stroke="none"/><text x="130" y="340" fill="#2F5D62" font-family="Arial,sans-serif" font-size="35" font-weight="700"><tspan x="130" dy="0">Fase terang</tspan></text><text x="130" y="390" fill="#1F1F1B" font-family="Arial,sans-serif" font-size="24" font-weight="400"><tspan x="130" dy="0">Cahaya membantu menyelaraskan ritme</tspan></text><text x="675" y="340" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="35" font-weight="700"><tspan x="675" dy="0">Fase gelap</tspan></text><text x="675" y="390" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="24" font-weight="400"><tspan x="675" dy="0">Kesempatan tidur perlu dilindungi</tspan></text><line x1="105" y1="469" x2="1185" y2="469" stroke="#1F1F1B" stroke-width="2" marker-end="url(#a)"/><text x="100" y="512" fill="#5F625C" font-family="Arial,sans-serif" font-size="24" font-weight="400"><tspan x="100" dy="0">0 jam</tspan></text><text x="588" y="512" fill="#5F625C" font-family="Arial,sans-serif" font-size="24" font-weight="400"><tspan x="588" dy="0">12 jam</tspan></text><text x="1050" y="512" fill="#5F625C" font-family="Arial,sans-serif" font-size="24" font-weight="400"><tspan x="1050" dy="0">24 jam</tspan></text><text x="80" y="594" fill="#2F5D62" font-family="Arial,sans-serif" font-size="23" font-weight="400"><tspan x="80" dy="0">Skema siklus 24 jam; pembagian terang–gelap bukan jam kerja atau tidur baku.</tspan></text></svg>